<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Visual Style Suite</title>
  <desc id="desc">A warm editorial banner representing Translate, Extract, and Moodboard workflows.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4EBDD"/>
      <stop offset="0.55" stop-color="#E7D8BF"/>
      <stop offset="1" stop-color="#C9B38E"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243948"/>
      <stop offset="1" stop-color="#162833"/>
    </linearGradient>
    <pattern id="weave" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M0 14H28M14 0V28" stroke="#6E5138" stroke-width="1" opacity="0.12"/>
      <path d="M0 0L28 28M28 0L0 28" stroke="#A5412F" stroke-width="0.7" opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#162833" flood-opacity="0.16"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faded">
        <feFuncA type="table" tableValues="0 0.055"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
    </filter>
  </defs>

  <rect width="1600" height="620" rx="36" fill="url(#paper)"/>
  <rect width="1600" height="620" rx="36" fill="url(#weave)"/>

  <circle cx="1390" cy="120" r="250" fill="#A5412F" opacity="0.12"/>
  <circle cx="1450" cy="520" r="310" fill="#243948" opacity="0.1"/>
  <path d="M1060 70C1190 135 1160 250 1280 310S1500 370 1600 310" fill="none" stroke="#A5412F" stroke-width="5" opacity="0.42"/>
  <path d="M1060 98C1190 163 1160 278 1280 338S1500 398 1600 338" fill="none" stroke="#243948" stroke-width="2" opacity="0.28"/>

  <g transform="translate(105,92)" filter="url(#grain)">
    <rect x="0" y="0" width="104" height="8" rx="4" fill="#A5412F"/>
    <text x="0" y="76" fill="#243948" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" letter-spacing="1">Visual Style Suite</text>
    <text x="2" y="126" fill="#594936" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="4">SEE THE STYLE, NOT THE SUBJECT</text>
    <text x="0" y="210" fill="#243948" font-family="Georgia, 'Times New Roman', serif" font-size="31">Turn references into reusable creative direction.</text>
    <text x="0" y="254" fill="#6E5A42" font-family="Arial, Helvetica, sans-serif" font-size="20">Lighting · Composition · Camera · Texture · Color logic · Mood</text>
  </g>

  <g transform="translate(105,405)" filter="url(#shadow)">
    <g>
      <rect width="300" height="112" rx="18" fill="url(#indigo)"/>
      <text x="28" y="45" fill="#F4EBDD" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="3">01 · TRANSLATE</text>
      <text x="28" y="78" fill="#D7C6A8" font-family="Arial, Helvetica, sans-serif" font-size="17">Keep the DNA. Change the surface.</text>
    </g>
    <g transform="translate(330,0)">
      <rect width="300" height="112" rx="18" fill="#46503A"/>
      <text x="28" y="45" fill="#F4EBDD" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="3">02 · EXTRACT</text>
      <text x="28" y="78" fill="#DED8C7" font-family="Arial, Helvetica, sans-serif" font-size="17">Find the principles that repeat.</text>
    </g>
    <g transform="translate(660,0)">
      <rect width="300" height="112" rx="18" fill="#A5412F"/>
      <text x="28" y="45" fill="#FFF3E4" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="3">03 · MOODBOARD</text>
      <text x="28" y="78" fill="#F0D8C9" font-family="Arial, Helvetica, sans-serif" font-size="17">Build a complete visual world.</text>
    </g>
  </g>

  <g transform="translate(1320,395)" opacity="0.94">
    <circle cx="76" cy="76" r="76" fill="#F4EBDD" stroke="#243948" stroke-width="3"/>
    <path d="M76 27C110 47 113 99 76 125C39 99 42 47 76 27Z" fill="none" stroke="#A5412F" stroke-width="4"/>
    <path d="M27 76C47 42 99 39 125 76C99 113 47 110 27 76Z" fill="none" stroke="#46503A" stroke-width="4"/>
    <circle cx="76" cy="76" r="12" fill="#243948"/>
  </g>
</svg>
